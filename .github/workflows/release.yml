name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Publish to npm via a Trusted Publisher (OIDC): no NPM_TOKEN secret.
  # npmjs.com must have this repo + workflow (release.yml) registered as a trusted
  # publisher for @sshadows/bc-toolbox-envelope.
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # setup-node bundles npm 10 with Node 22; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard - tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }

      # prepublishOnly runs typecheck + tests + build before the tarball is packed.
      - name: Publish to npm
        run: npm publish --access public
